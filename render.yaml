services:
  - type: web
    name: facetroop
    runtime: node
    plan: free
    nodeVersion: "22.16.0"
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: ALLOWED_ORIGINS
        value: https://www.facetroop.com,https://facetroop.com,https://facetroop.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: facetroop-db
          property: connectionString

databases:
  - name: facetroop-db
    plan: basic-256mb
