services:
  postgres:
    image: postgres:16-alpine
    container_name: facetroop-postgres
    environment:
      POSTGRES_USER: facetroop
      POSTGRES_PASSWORD: facetroop
      POSTGRES_DB: facetroop
    ports:
      - "5432:5432"
    volumes:
      - facetroop_pg:/var/lib/postgresql/data

volumes:
  facetroop_pg:
